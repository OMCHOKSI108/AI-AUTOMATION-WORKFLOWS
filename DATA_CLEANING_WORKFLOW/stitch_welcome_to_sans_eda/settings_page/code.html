<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1173d4",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-black dark:text-white">
<div class="flex min-h-screen">
<aside class="w-80 bg-background-light dark:bg-background-dark border-r border-primary/20 dark:border-primary/30 flex flex-col">
<div class="p-6 flex items-center gap-3">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAt1oYohWKzw3awMvPAxI8SQfU5NDpn_9MqbHy6EJgmjejMa84E1EAthYcipGWskk7jS_5Yo00lCGTk8QAi7m0thjeCQRxwh6FErwQBE-L3qL4N2RDaFWyz8XGpJgci5wU2teOGRfnbBZ4TmuWcAhtpDJZBjyLviHKtSAgyC4AlLA3I-OiDkaT4s_e25k00Rugz46oQgEDG9YFpx-njsFfFs9zZLfhHP9pOgaNnQZolOT_xRTXAYf8rhwkkA1LLNFUdSfNCnSn1hA");'></div>
<h1 class="text-lg font-bold">DataPulse</h1>
</div>
<nav class="flex-1 px-4 py-2 space-y-2">
<a class="flex items-center gap-3 px-4 py-2 rounded-lg text-black dark:text-white hover:bg-primary/10 dark:hover:bg-primary/20" href="#">
<span class="material-symbols-outlined">home</span>
<span>Dashboard</span>
</a>
<a class="flex items-center gap-3 px-4 py-2 rounded-lg text-black dark:text-white hover:bg-primary/10 dark:hover:bg-primary/20" href="#">
<span class="material-symbols-outlined">assessment</span>
<span>Reports</span>
</a>
<a class="flex items-center gap-3 px-4 py-2 rounded-lg text-black dark:text-white hover:bg-primary/10 dark:hover:bg-primary/20" href="#">
<span class="material-symbols-outlined">storage</span>
<span>Data Sources</span>
</a>
<a class="flex items-center gap-3 px-4 py-2 rounded-lg text-black dark:text-white hover:bg-primary/10 dark:hover:bg-primary/20" href="#">
<span class="material-symbols-outlined">group</span>
<span>Team</span>
</a>
<a class="flex items-center gap-3 px-4 py-2 rounded-lg bg-primary/10 dark:bg-primary/20 text-primary" href="#">
<span class="material-symbols-outlined">settings</span>
<span>Settings</span>
</a>
</nav>
<div class="p-4 mt-auto">
<button class="w-full bg-primary text-white font-bold py-2 px-4 rounded-lg">New Report</button>
<a class="flex items-center gap-3 px-4 py-2 mt-4 rounded-lg text-black dark:text-white hover:bg-primary/10 dark:hover:bg-primary/20" href="#">
<span class="material-symbols-outlined">help_outline</span>
<span>Help and docs</span>
</a>
</div>
</aside>
<main class="flex-1 p-8">
<h1 class="text-3xl font-bold mb-8">Settings</h1>
<div class="space-y-12">
<section>
<h2 class="text-2xl font-bold mb-6">Profile</h2>
<div class="max-w-xl space-y-6">
<div>
<label class="block text-sm font-medium mb-2" for="name">Name</label>
<input class="w-full p-3 rounded-lg border border-primary/20 dark:border-primary/30 bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary" id="name" type="text"/>
</div>
<div>
<label class="block text-sm font-medium mb-2" for="email">Email</label>
<input class="w-full p-3 rounded-lg border border-primary/20 dark:border-primary/30 bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary" id="email" type="email"/>
</div>
<div>
<label class="block text-sm font-medium mb-2" for="password">Password</label>
<input class="w-full p-3 rounded-lg border border-primary/20 dark:border-primary/30 bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary" id="password" type="password"/>
</div>
<div>
<button class="bg-primary text-white font-bold py-2 px-4 rounded-lg">Update Profile</button>
</div>
</div>
</section>
<section>
<h2 class="text-2xl font-bold mb-6">Notifications</h2>
<div class="max-w-xl space-y-4">
<label class="flex items-center">
<input checked="" class="form-checkbox h-5 w-5 text-primary rounded border-primary/40 dark:border-primary/50 bg-background-light dark:bg-background-dark focus:ring-primary" type="checkbox"/>
<span class="ml-3">Email notifications</span>
</label>
<label class="flex items-center">
<input checked="" class="form-checkbox h-5 w-5 text-primary rounded border-primary/40 dark:border-primary/50 bg-background-light dark:bg-background-dark focus:ring-primary" type="checkbox"/>
<span class="ml-3">Push notifications</span>
</label>
<label class="flex items-center">
<input class="form-checkbox h-5 w-5 text-primary rounded border-primary/40 dark:border-primary/50 bg-background-light dark:bg-background-dark focus:ring-primary" type="checkbox"/>
<span class="ml-3">In-app notifications</span>
</label>
<div>
<button class="bg-primary text-white font-bold py-2 px-4 rounded-lg mt-2">Update Notifications</button>
</div>
</div>
</section>
<section>
<h2 class="text-2xl font-bold mb-6">Preferences</h2>
<div class="max-w-xl space-y-6">
<div>
<label class="block text-sm font-medium mb-2" for="language">Language</label>
<select class="w-full p-3 rounded-lg border border-primary/20 dark:border-primary/30 bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary" id="language">
<option>English</option>
<option>Spanish</option>
<option>French</option>
</select>
</div>
<div>
<label class="block text-sm font-medium mb-2" for="theme">Theme</label>
<select class="w-full p-3 rounded-lg border border-primary/20 dark:border-primary/30 bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary" id="theme">
<option>Light</option>
<option>Dark</option>
<option>System</option>
</select>
</div>
<div>
<button class="bg-primary text-white font-bold py-2 px-4 rounded-lg">Update Preferences</button>
</div>
</div>
</section>
</div>
</main>
</div>

</body></html>
