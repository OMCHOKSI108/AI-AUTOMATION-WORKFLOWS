<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
        :root {
          --primary-color: #4f46e5;
          --background-color: #f8fafc;
          --card-background-color: #ffffff;
          --text-color: #1f2937;
          --input-border-color: #d1d5db;
          --input-focus-border-color: #4f46e5;
        }
    </style>
</head>
<body class="bg-[var(--background-color)] font-sans text-[var(--text-color)]">
<div class="flex min-h-screen flex-col items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-md space-y-8">
<div>
<svg class="mx-auto h-12 w-auto text-[var(--primary-color)]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 21a9.004 9.004 0 0 0 8.716-6.983c.205-.536.42-.997.42-1.442 0-3.328-5.373-6-12-6S.864 9.247.864 12.575c0 .445.215.906.42 1.442A9.004 9.004 0 0 0 12 21Z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 3v1m0 16v1m-7.07-7.071 1.414-1.414M17.657 6.343l-1.414 1.414m-12.728 0 1.414 1.414M19.071 17.657l-1.414-1.414M2.929 12h1m16.142 0h1M4.929 4.929l1.414 1.414M17.657 17.657l-1.414-1.414" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-gray-900">
                    Sign in to your account
                </h2>
</div>
<div class="rounded-lg bg-[var(--card-background-color)] p-8 shadow-lg">
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-sm font-medium text-gray-700" for="email">
                            Email or Username
                        </label>
<div class="mt-1">
<input autocomplete="email" class="block w-full appearance-none rounded-md border border-[var(--input-border-color)] px-3 py-2 placeholder-gray-400 shadow-sm focus:border-[var(--input-focus-border-color)] focus:outline-none focus:ring-[var(--input-focus-border-color)] sm:text-sm" id="email" name="email" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700" for="password">
                            Password
                        </label>
<div class="mt-1">
<input autocomplete="current-password" class="block w-full appearance-none rounded-md border border-[var(--input-border-color)] px-3 py-2 placeholder-gray-400 shadow-sm focus:border-[var(--input-focus-border-color)] focus:outline-none focus:ring-[var(--input-focus-border-color)] sm:text-sm" id="password" name="password" required="" type="password"/>
</div>
</div>
<div>
<button class="flex w-full justify-center rounded-md border border-transparent bg-[var(--primary-color)] py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2" type="submit">
                            Login
                        </button>
</div>
<div class="text-center">
<p class="text-sm text-red-600">
                            Invalid credentials. Please try again.
                        </p>
</div>
</form>
</div>
</div>
</div>

</body></html>
